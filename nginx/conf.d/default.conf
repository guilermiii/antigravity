upstream portfolio_upstream {
    server portfolio_landing:3001;
}

upstream crud_upstream {
    server react_frontend:3000;
}

upstream backend_upstream {
    server fastapi_app:8000;
}

# ==============================================================================
# Servidor HTTP (Porta 80) - Produção DuckDNS (Redirecionamento HTTPS)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name guilermiii.duckdns.org www.guilermiii.duckdns.org;

    # Endpoint para validação HTTP-01 do Certbot / Let's Encrypt (OBRIGATÓRIO em HTTP)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirecionamento permanente automático de todo tráfego HTTP para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# Servidor HTTP (Porta 80) - Desenvolvimento Local (localhost)
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost 127.0.0.1;

    # Endpoint para validação ACME local se necessário
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy para rotas da API FastAPI
    location /users/ {
        proxy_pass http://backend_upstream/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /users {
        proxy_pass http://backend_upstream/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend_upstream/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        proxy_pass http://backend_upstream/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CRUD Frontend React SPA (:3000)
    location /crud/ {
        proxy_pass http://crud_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /crud {
        return 301 /crud/;
    }

    # DevOps Portfolio Landing Page SPA (:3001)
    location / {
        proxy_pass http://portfolio_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# Servidor HTTPS / SSL (Porta 443) - Produção e Testes TLS
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name guilermiii.duckdns.org www.guilermiii.duckdns.org localhost;

    # Certificados SSL gerenciados pelo Certbot
    ssl_certificate /etc/letsencrypt/live/guilermiii.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guilermiii.duckdns.org/privkey.pem;

    # Parâmetros modernos de segurança TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers de Segurança HSTS
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy para rotas da API FastAPI
    location /users/ {
        proxy_pass http://backend_upstream/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

name: CI - Development Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  backend-dev:
    name: Backend Unit, Security & API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: users_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/users_db
      JWT_SECRET_KEY: test_jwt_secret_key_antigravity_32bytes
      JWT_ALGORITHM: HS256
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: development
      DEBUG: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations
        run: |
          alembic upgrade head

      - name: Run Unit, Security (SQLi/XSS/CSRF/JWT) Tests
        run: |
          python -m unittest discover -s tests

      - name: Run API Integration Tests
        run: |
          python test_app.py

  frontend-dev:
    name: Frontend Vitest & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Vitest Test Suite (68 Tests)
        working-directory: ./frontend
        run: npm test -- --run

      - name: Verify Frontend Production Build
        working-directory: ./frontend
        run: npm run build

  approval-gate:
    name: Development Quality Gate & Main Promotion Approval
    needs: [backend-dev, frontend-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Validate Pipeline Completion
        run: |
          echo "========================================================"
          echo "✔ Todos os testes de backend, segurança e frontend passaram!"
          echo "✔ Branch development validada e aprovada com sucesso!"
          echo "✔ Status: APROVADO PARA PROMOÇÃO / MERGE NA BRANCH MAIN."
          echo "========================================================"
      - name: Generate Summary
        run: |
          echo "### 🚀 Development Pipeline: APROVADO" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Tests**: 46 testes unitários e de segurança aprovados (100%)" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Tests**: 68 testes de componentes, responsividade e auth aprovados (100%)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: Verificação de bundle do Vite compilada sem erros" >> $GITHUB_STEP_SUMMARY
          echo "- **Status de Liberação**: Pronto para abertura de Pull Request e merge na branch \`main\`" >> $GITHUB_STEP_SUMMARY

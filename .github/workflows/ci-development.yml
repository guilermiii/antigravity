name: CI - Development Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  backend-dev:
    name: Backend Unit, Security & API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: users_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/users_db
      JWT_SECRET_KEY: test_jwt_secret_key_antigravity_32bytes
      JWT_ALGORITHM: HS256
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: development
      DEBUG: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations
        working-directory: ./apps/backend
        run: |
          alembic upgrade head

      - name: Run Unit, Security (SQLi/XSS/CSRF/JWT) Tests
        working-directory: ./apps/backend
        run: |
          python -m unittest discover -s tests

      - name: Start API Server & Run Integration Tests
        working-directory: ./apps/backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          UVICORN_PID=$!
          echo "Aguardando API FastAPI inicializar..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
              echo "FastAPI operacional!"
              break
            fi
            sleep 1
          done
          python test_app.py
          kill $UVICORN_PID || true

  frontend-dev:
    name: CRUD Frontend Vitest & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/crud-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./apps/crud-frontend
        run: npm ci

      - name: Run Frontend Vitest Test Suite (85 Tests)
        working-directory: ./apps/crud-frontend
        run: npm test -- --run

      - name: Verify Frontend Production Build
        working-directory: ./apps/crud-frontend
        run: npm run build

  portfolio-dev:
    name: Portfolio Landing Page Vitest & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/portfolio/package-lock.json

      - name: Install Portfolio Dependencies
        working-directory: ./apps/portfolio
        run: npm ci

      - name: Run Portfolio Vitest Test Suite (19 Tests)
        working-directory: ./apps/portfolio
        run: npm test -- --run

      - name: Verify Portfolio Production Build
        working-directory: ./apps/portfolio
        run: npm run build

  approval-gate:
    name: Development Quality Gate & Main Promotion Approval
    needs: [backend-dev, frontend-dev, portfolio-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Validate Pipeline Completion
        run: |
          echo "========================================================"
          echo "✔ Todos os testes de backend, segurança, crud e portfolio passaram!"
          echo "✔ Branch development validada e aprovada com sucesso!"
          echo "✔ Status: APROVADO PARA PROMOÇÃO / MERGE NA BRANCH MAIN."
          echo "========================================================"
      - name: Generate Summary
        run: |
          echo "### 🚀 Development Pipeline: APROVADO" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Tests**: 63 testes unitários e de segurança aprovados (100%)" >> $GITHUB_STEP_SUMMARY
          echo "- **CRUD Frontend Tests**: 85 testes de componentes e auth aprovados (100%)" >> $GITHUB_STEP_SUMMARY
          echo "- **Portfolio Tests**: 19 testes de Landing Page, tema e componentes aprovados (100%)" >> $GITHUB_STEP_SUMMARY
          echo "- **Builds**: Bundles compilados sem erros" >> $GITHUB_STEP_SUMMARY
          echo "- **Status de Liberação**: Pronto para merge na branch \`main\`" >> $GITHUB_STEP_SUMMARY

  auto-merge-to-main:
    name: Auto-Merge Development to Main & Trigger Production CI
    needs: [backend-dev, frontend-dev, portfolio-dev, approval-gate]
    if: github.ref == 'refs/heads/development' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Development into Main and Push
        run: |
          echo "Iniciando merge automatizado da branch development na branch main..."
          git fetch origin main
          git checkout main
          git pull origin main --rebase
          git merge --no-ff development -m "chore(release): auto-merge validated development into main [skip ci]"
          git push origin main
          echo "✔ Merge concluído e enviado para origin/main com sucesso!"

      - name: Trigger Main Production Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Disparando esteira de produção (ci-main.yml) na branch main..."
          gh workflow run "CI - Main Production Pipeline" --ref main
          echo "✔ Esteira de produção acionada com sucesso no GitHub Actions!"

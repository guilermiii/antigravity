name: CI - Main Production Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  production-tests:
    name: Production Backend & Security Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: users_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/users_db
      JWT_SECRET_KEY: production_jwt_secret_key_antigravity_32bytes
      JWT_ALGORITHM: HS256
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: production
      DEBUG: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations
        run: |
          alembic upgrade head

      - name: Run Complete Unit & Security Tests
        run: |
          python -m unittest discover -s tests

      - name: Start API Server & Run Integration Tests
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          UVICORN_PID=$!
          echo "Aguardando API FastAPI inicializar..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/health > /dev/null; then
              echo "FastAPI operacional!"
              break
            fi
            sleep 1
          done
          python test_app.py
          kill $UVICORN_PID || true

  frontend-production-build:
    name: Frontend Production Bundle & Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Suite
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Optimized Production Bundle
        working-directory: ./frontend
        run: npm run build

  docker-compose-e2e:
    name: Live Docker Compose Multi-Container E2E Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and Launch Docker Compose Stack
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for Services to be Healthy
        run: |
          echo "Aguardando serviços ficarem online..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/ > /dev/null && curl -s -f http://localhost:3000/ > /dev/null; then
              echo "Todos os serviços responderam com sucesso!"
              break
            fi
            echo "Tentativa $i/30: Aguardando..."
            sleep 2
          done

      - name: Run Live OAuth2 & Security E2E Test
        run: |
          python3 test_e2e_auth.py

      - name: Run Live Fullstack CRUD E2E Test
        run: |
          python3 test_e2e.py

      - name: Teardown Docker Compose Stack
        if: always()
        run: |
          docker compose down -v

  release-ready:
    name: Production Release Readiness Gate
    needs: [production-tests, frontend-production-build, docker-compose-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Production Gate
        run: |
          echo "========================================================"
          echo "✔ Pipeline de Produção (Main) concluída com 100% de sucesso!"
          echo "✔ Validação E2E com Docker Compose ao vivo aprovada!"
          echo "✔ Aplicação pronta para deploy contínuo / release estável."
          echo "========================================================"
      - name: Generate Summary
        run: |
          echo "### 🏆 Main Pipeline (Produção): SUCESSO TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend & Segurança**: Testes unitários, validações e blindagem de segurança aprovados" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Production Build**: Compilação estrita e 69 testes no Vitest aprovados" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Compose E2E**: Stack multicontêiner ao vivo validada com \`test_e2e.py\` e \`test_e2e_auth.py\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status de Release**: ESTÁVEL E APROVADO PARA PRODUÇÃO" >> $GITHUB_STEP_SUMMARY
